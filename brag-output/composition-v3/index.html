      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F5F3EF; }

      :root {
        --paper: #F5F3EF;
        --ink: #111111;
        --muted: #6E6A63;
        --red: #F20505;
        --navy: #0E1626;
        --red-on-navy: #FF4433;
        --sans: ui-sans-serif, system-ui, sans-serif;
        --mono: ui-monospace, monospace;
      }

      #root { width: 100%; height: 100%; position: relative; background: var(--paper); font-family: var(--sans); }
      .clip { position: absolute; inset: 0; }
      .display { font-weight: 800; letter-spacing: -0.035em; line-height: 1; color: var(--ink); white-space: nowrap; }
      .meta { font-family: var(--mono); font-weight: 700; letter-spacing: 0.16em; }

      /* ================= S1 — the feed ================= */
      /* A slow dot drift so the paper is never a dead plate. */
      #s1-grid { position: absolute; inset: -80px; opacity: 0.55;
                 background-image: radial-gradient(circle, rgba(17,17,17,0.15) 1.6px, transparent 1.7px);
                 background-size: 48px 48px; }

      #ph1 { position: absolute; left: 190px; top: 170px; width: 360px; height: 740px; }
      .dev { position: absolute; inset: 0; border-radius: 46px; background: var(--navy);
             box-shadow: 0 34px 90px rgba(17,17,17,0.22); }
      #ph1-scr { position: absolute; left: 10px; top: 10px; width: 340px; height: 720px;
                 border-radius: 36px; overflow: hidden; background: #EFECE5; }
      #ph1-notch { position: absolute; left: 120px; top: 22px; width: 120px; height: 20px;
                   border-radius: 10px; background: var(--navy); }
      #feed { position: absolute; left: 20px; top: 0; width: 300px; filter: blur(0px); }
      .fc { position: relative; width: 300px; height: 220px; border-radius: 14px;
            margin-bottom: 18px; overflow: hidden; }
      .fc.red { background: var(--red); }
      .fc-av { position: absolute; left: 16px; top: 16px; width: 34px; height: 34px;
               border-radius: 17px; background: rgba(17,17,17,0.16); }
      .fc-b1 { position: absolute; left: 62px; top: 22px; width: 150px; height: 11px;
               border-radius: 6px; background: rgba(17,17,17,0.16); }
      .fc-b2 { position: absolute; left: 62px; top: 42px; width: 92px; height: 9px;
               border-radius: 5px; background: rgba(17,17,17,0.10); }
      .fc-img { position: absolute; left: 16px; top: 72px; width: 268px; height: 132px;
                border-radius: 10px; background: rgba(17,17,17,0.09); }
      .fc.red .fc-av, .fc.red .fc-b1 { background: rgba(255,255,255,0.80); }
      .fc.red .fc-b2 { background: rgba(255,255,255,0.55); }
      .fc.red .fc-img { background: rgba(255,255,255,0.20); }

      #ph1-rail { position: absolute; right: 7px; top: 0; width: 3px; height: 720px;
                  border-radius: 2px; background: rgba(17,17,17,0.10); }
      #ph1-thumb { position: absolute; right: 7px; top: 0; width: 3px; height: 90px;
                   border-radius: 2px; background: rgba(17,17,17,0.34); }

      .chip { position: absolute; width: 72px; height: 72px; border-radius: 23px; background: #FFFFFF;
              box-shadow: 0 10px 26px rgba(17,17,17,0.12); display: flex; align-items: center;
              justify-content: center; opacity: 0; }
      .chip svg { width: 34px; height: 34px; fill: var(--ink); opacity: 0.80; }

      .h1 { position: absolute; left: 700px; font-size: 96px; }
      #h1a { top: 372px; } #h1b { top: 478px; }
      #h1rule { position: absolute; left: 700px; top: 606px; width: 300px; height: 4px;
                background: var(--red); transform-origin: 0% 50%; }
      #h1c { position: absolute; left: 702px; top: 638px; font-size: 30px; color: var(--red); }

      /* ================= S2 — the stop ================= */
      /* The card the feed stops on, grown to the full frame from its own place. */
      #s2-field { position: absolute; inset: 0; background: var(--red); transform-origin: 13.58% 50%; }
      .fly { position: absolute; width: 300px; height: 220px; border-radius: 14px;
             border: 3px solid rgba(255,255,255,0.55); background: rgba(255,255,255,0.07); }

    <script>
      const E = { out: "power3.out", soft: "power2.out", inOut: "power2.inOut", sine: "sine.inOut" };
      const tl = gsap.timeline({ paused: true });

      /* =====================================================================
         S1 — the feed
         The scroll is three chained tweens whose velocities MATCH at the
         joins (800 px/s), so it accelerates, runs flat, and decelerates into
         the stop without a single velocity step. Everything else in the scene
         is continuous too: the grid drifts, the phone breathes, chips rise.
         ===================================================================== */
      tl.to("#s1-grid", { y: 48, duration: 5.2, ease: "none" }, 0.05);

      tl.fromTo("#ph1", { opacity: 0, y: 46, scale: 0.965 },
                        { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: E.out }, 0.10);
      tl.to("#ph1", { y: -7, duration: 2.5, ease: E.sine, repeat: 1, yoyo: true }, 0.95);

      tl.to("#feed", { y: -440,  duration: 1.09, ease: "power2.in" }, 0.10);   // v -> 800 px/s
      tl.to("#feed", { y: -2920, duration: 3.10, ease: "none" },      1.20);   // v =  800 px/s
      tl.to("#feed", { y: -3320, duration: 0.98, ease: E.soft },      4.30);   // v 800 -> 0
      tl.to("#feed", { filter: "blur(6px)", duration: 1.04, ease: "power2.in" }, 0.10);
      tl.to("#feed", { filter: "blur(0px)", duration: 0.98, ease: E.soft }, 4.30);

      tl.to("#ph1-thumb", { y: 84,  duration: 1.09, ease: "power2.in" }, 0.10);
      tl.to("#ph1-thumb", { y: 554, duration: 3.10, ease: "none" },      1.20);
      tl.to("#ph1-thumb", { y: 630, duration: 0.98, ease: E.soft },      4.30);

      // Five UI chips rise past the phone on a stagger — the scene never has a
      // frame with nothing moving in it.
      [["#c0", 0.85], ["#c1", 1.45], ["#c2", 2.05], ["#c3", 2.70], ["#c4", 3.35]].forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0, y: 26, scale: 0.9 },
                       { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: E.out }, t);
        tl.to(sel, { y: -78, duration: 2.30, ease: "none" }, t + 0.55);
        tl.to(sel, { opacity: 0, duration: 0.55, ease: E.inOut }, t + 2.30);
      });

      // 1.07 / 1.59 are beats. The hook is up inside the first second and a half.
      tl.fromTo("#h1a", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.52, ease: E.out }, 1.07);
      tl.fromTo("#h1b", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.52, ease: E.out }, 1.59);
      tl.fromTo("#h1rule", { scaleX: 0 }, { scaleX: 1, duration: 0.46, ease: E.out }, 3.18);
      tl.fromTo("#h1c", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.44, ease: E.out }, 3.32);
      tl.to(["#h1a", "#h1b", "#h1rule", "#h1c"], { opacity: 0, duration: 0.26, ease: E.inOut }, 5.06);

      /* =====================================================================
         S2 — the stop
         The red card the feed lands on IS the next scene: it grows from its
         own place in the phone to the whole frame. Its corner radius unwinds
         on the way out so it stops being a card exactly as it becomes a field.
         ===================================================================== */
      gsap.set("#s2-field", { scaleX: 0.15625, scaleY: 0.2037, borderRadius: 90 });
      tl.to("#s2-field", { scaleX: 1, scaleY: 1, borderRadius: 0, duration: 0.64, ease: E.inOut }, 5.44);
      // Three cards carry on past the stop and leave the top of the frame.
      [["#fly0", 5.46], ["#fly1", 5.52], ["#fly2", 5.58]].forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0.9, y: 0 }, { opacity: 0, y: -940, duration: 1.05, ease: E.soft }, t);
      });
      // The phone goes once the plate has passed its edges, so the card inside
      // it never shows a second, differently-rounded edge against the field.
      tl.to(["#ph1", "#s1-grid"], { opacity: 0, duration: 0.30, ease: E.inOut }, 5.62);
      tl.fromTo("#h2k", { opacity: 0 }, { opacity: 0.85, duration: 0.4 }, 6.10);
      tl.fromTo("#h2a", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: E.out }, 6.34);
      tl.fromTo("#h2b", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: E.out }, 6.86);
      // The red does not leave on its own — the next chapter pushes it off.
      // It drifts up at a third of the incoming plate's rate, so the handoff
      // parallaxes instead of cutting. (S3 paints above S2, so sliding the red
      // out by itself would have happened behind an opaque plate: invisible.)
      tl.to(["#s2-field", ".h2", "#h2k"], { y: -380, duration: 0.66, ease: E.inOut }, 8.96);
      tl.to([".h2", "#h2k"], { opacity: 0, duration: 0.30, ease: E.inOut }, 9.10);

      /* =====================================================================
         S3 — production. The chapter arrives by scrolling up into frame.
         ===================================================================== */
      gsap.set("#s3-all", { y: 1140 });
      tl.to("#s3-all", { y: 0, duration: 0.66, ease: E.inOut }, 8.96);
      // The viewfinder closes onto the frame instead of appearing on it.
      [["#brk0", -46, -46], ["#brk1", 46, -46], ["#brk2", -46, 46], ["#brk3", 46, 46]].forEach(([sel, dx, dy]) => {
        tl.fromTo(sel, { opacity: 0, x: dx, y: dy }, { opacity: 1, x: 0, y: 0, duration: 0.7, ease: E.out }, 9.40);
      });
      tl.fromTo("#s3-head", { opacity: 0 }, { opacity: 1, duration: 0.36 }, 9.56);
      tl.fromTo("#rec", { opacity: 0 }, { opacity: 1, duration: 0.36 }, 9.62);
      // A slow pulse, not a blink — deterministic and never a hard edge.
      tl.to("#rec-dot", { opacity: 0.25, duration: 0.62, ease: E.sine, repeat: 3, yoyo: true }, 9.80);
      // The camera arrives, then keeps drifting for the whole chapter.
      tl.fromTo("#cam", { opacity: 0, x: -54, scale: 0.94 },
                        { opacity: 1, x: 0, scale: 1, duration: 0.85, ease: E.out }, 9.44);
      tl.to("#cam", { x: 26, y: -10, duration: 3.2, ease: E.sine }, 10.30);
      // The iris opens as the first verb lands.
      tl.to("#cam-iris", { attr: { r: 30 }, duration: 0.9, ease: E.inOut }, 9.90);
      // One light pass across the dark chapter.
      tl.fromTo("#s3-sweep", { x: 0 }, { x: 2900, duration: 3.4, ease: E.inOut }, 9.60);
      // 10.01 / 10.54 / 11.06 / 11.60 are beats. The verbs accumulate; all four
      // are on screen together from 11.60, so each is readable for over a second.
      [["#vb0", 10.01], ["#vb1", 10.54], ["#vb2", 11.06], ["#vb3", 11.60]].forEach(([sel, t]) => {
        tl.fromTo(sel, { opacity: 0, x: 44 }, { opacity: 1, x: 0, duration: 0.5, ease: E.out }, t);
      });
      // The chapter scrolls away upward — same gesture as the feed.
      tl.to("#s3-all", { y: -1140, duration: 0.66, ease: E.inOut }, 12.65);

      /* =====================================================================
         S4 — four phones
         ===================================================================== */
      tl.fromTo("#s4-head", { opacity: 0 }, { opacity: 1, duration: 0.36 }, 13.00);
      tl.fromTo("#s4-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: E.out }, 13.04);
      // Each phone rises into place on a beat, then keeps drifting at its own
      // rate and phase — the row is never static and never in lockstep.
      [["#sp0", 13.70, -10], ["#sp1", 14.22, 9], ["#sp2", 14.76, -8], ["#sp3", 15.28, 11]].forEach(([sel, t, drift]) => {
        tl.fromTo(sel, { opacity: 0, y: 92, scale: 0.95 },
                       { opacity: 1, y: 0, scale: 1, duration: 0.78, ease: E.out }, t);
        tl.to(sel + " .sp-dev", { y: drift, duration: 2.6, ease: E.sine }, t + 0.78);
      });
      // Each screen scrolls its own content slowly, at its own speed.
      [["#sps0", -120], ["#sps1", -166], ["#sps2", -96], ["#sps3", -142]].forEach(([sel, d]) => {
        tl.fromTo(sel, { y: 0 }, { y: d, duration: 3.6, ease: E.sine }, 13.80);
      });
      // The row leaves downward, out of the way of the address.
      tl.to([".sp"], { opacity: 0, y: 150, duration: 0.6, ease: "power2.in" }, 16.86);
      tl.to(["#s4-head", "#s4-rule"], { opacity: 0, duration: 0.4, ease: E.inOut }, 16.86);

      /* =====================================================================
         S5 — the address. 17.91 / 18.44 / 19.48 are beats; then it stops.
         ===================================================================== */
      tl.fromTo("#s5-logo", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.56, ease: E.out }, 17.91);
      tl.fromTo("#s5-url", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.46, ease: E.out }, 18.44);
      tl.fromTo("#s5-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.46, ease: E.out }, 19.48);
      tl.fromTo("#s5-tag", { opacity: 0 }, { opacity: 1, duration: 0.42 }, 20.02);
      // From ~20.45s nothing moves and nothing sounds.

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
