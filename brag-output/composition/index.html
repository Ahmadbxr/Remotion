<!doctype html>
<html lang="de" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F5F3EF; }

      :root {
        --paper: #F5F3EF;
        --ink: #111111;
        --muted: #6E6A63;
        --red: #F20505;
        --navy: #0E1626;
        --red-on-navy: #FF4433;
        --sans: ui-sans-serif, system-ui, sans-serif;
        --mono: ui-monospace, monospace;
      }

      #root { width: 100%; height: 100%; position: relative; background: var(--paper); font-family: var(--sans); }
      .clip { position: absolute; inset: 0; }

      .display { font-weight: 800; letter-spacing: -0.035em; line-height: 0.98; color: var(--ink); white-space: nowrap; }
      .meta { font-family: var(--mono); font-weight: 600; letter-spacing: 0.14em; color: var(--muted); }

      /* ---------- S1 the turn ---------- */
      .s1-line { position: absolute; left: 150px; font-size: 100px; }
      #s1a { top: 330px; } #s1b { top: 432px; }
      #s1c { top: 566px; color: var(--red); } #s1d { top: 668px; color: var(--red); }

      /* ---------- S2 the red takeover ---------- */
      #s2-field { position: absolute; inset: 0; background: var(--red); transform-origin: 9% 57%; }
      .s2-line { position: absolute; left: 150px; font-size: 100px; font-weight: 800; letter-spacing: -0.035em; color: #FFFFFF; white-space: nowrap; }
      #s2a { top: 424px; } #s2b { top: 534px; }

      /* ---------- S3 the service system ---------- */
      #s3-rail { position: absolute; left: 150px; top: 300px; width: 6px; height: 500px; background: var(--red); transform-origin: 50% 0%; }
      #s3-label { position: absolute; left: 150px; top: 238px; font-size: 26px; }
      .svc { position: absolute; left: 208px; width: 1500px; height: 110px; }
      .svc .idx { position: absolute; left: 0; top: 14px; font-family: var(--mono); font-size: 30px; font-weight: 700; letter-spacing: 0.1em; color: var(--red); }
      .svc .nm  { position: absolute; left: 150px; top: 0; font-size: 96px; font-weight: 800; letter-spacing: -0.035em; color: var(--ink); white-space: nowrap; }
      #svc0 { top: 306px; } #svc1 { top: 434px; } #svc2 { top: 562px; } #svc3 { top: 690px; }

      /* ---------- S4 process to proof ---------- */
      #s4-field { position: absolute; inset: 0; background: var(--navy); transform-origin: 50% 100%; }
      #s4-line { position: absolute; left: 190px; top: 468px; width: 1540px; height: 6px; background: var(--red-on-navy); transform-origin: 0% 50%; }
      .stage { position: absolute; top: 396px; font-size: 54px; font-weight: 800; letter-spacing: 0.02em; color: #F5F3EF; white-space: nowrap; }
      #st0 { left: 190px; } #st1 { left: 520px; } #st2 { left: 840px; } #st3 { left: 1150px; } #st4 { left: 1470px; }
      #s4-num { position: absolute; left: 190px; top: 580px; font-size: 230px; font-weight: 800; letter-spacing: -0.045em; color: #F5F3EF; }
      #s4-grow { position: absolute; left: 196px; top: 536px; font-family: var(--mono); font-size: 30px; font-weight: 700; letter-spacing: 0.16em; color: var(--red-on-navy); }

      /* ---------- S5 the address ---------- */
      #s5-paper { position: absolute; inset: 0; background: var(--paper); transform-origin: 50% 50%; }
      #s5-logo { position: absolute; left: 50%; top: 300px; width: 560px; margin-left: -280px; }
      #s5-url { position: absolute; left: 0; right: 0; top: 590px; text-align: center; font-size: 96px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
      #s5-rule { position: absolute; left: 50%; top: 712px; width: 430px; height: 5px; margin-left: -215px; background: var(--red); transform-origin: 0% 50%; }
      #s5-tag { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-family: var(--mono); font-size: 27px; font-weight: 600; letter-spacing: 0.15em; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.5" data-width="1920" data-height="1080">

      <!-- S1 — the turn (0 -> 3.70) -->
      <div class="clip" id="s1" data-start="0" data-duration="3.7" data-track-index="0">
        <div id="s1a" class="display s1-line">DEINE MARKE IST</div>
        <div id="s1b" class="display s1-line">NICHT LANGWEILIG.</div>
        <div id="s1c" class="display s1-line">DEIN CONTENT</div>
        <div id="s1d" class="display s1-line">VIELLEICHT SCHON.</div>
      </div>

      <!-- S2 — the red takeover (3.70 -> 7.38) -->
      <div class="clip" id="s2" data-start="3.7" data-duration="3.68" data-track-index="1">
        <div id="s2-field" data-layout-allow-overflow></div>
        <div id="s2a" class="s2-line">WIR MACHEN CONTENT,</div>
        <div id="s2b" class="s2-line">DEN MAN NICHT WEGSWIPT.</div>
      </div>

      <!-- S3 — the service system (7.38 -> 12.65) -->
      <div class="clip" id="s3" data-start="7.38" data-duration="5.27" data-track-index="2">
        <div id="s3-label" class="meta">OFFSCRIPT SERVICES</div>
        <div id="s3-rail"></div>
        <div class="svc" id="svc0"><div class="idx">01/04</div><div class="nm">CONTENT</div></div>
        <div class="svc" id="svc1"><div class="idx">02/04</div><div class="nm">STRATEGIE</div></div>
        <div class="svc" id="svc2"><div class="idx">03/04</div><div class="nm">SOCIAL</div></div>
        <div class="svc" id="svc3"><div class="idx">04/04</div><div class="nm">CREATOR</div></div>
      </div>

      <!-- S4 — process to proof (12.65 -> 16.86) -->
      <div class="clip" id="s4" data-start="12.65" data-duration="4.21" data-track-index="3">
        <div id="s4-field"></div>
        <div id="s4-line"></div>
        <div class="stage" id="st0">IDEA</div>
        <div class="stage" id="st1">SHOOT</div>
        <div class="stage" id="st2">EDIT</div>
        <div class="stage" id="st3">POST</div>
        <div class="stage" id="st4">GROW</div>
        <div id="s4-grow" class="meta">OUTCOME</div>
        <div id="s4-num">100K+</div>
      </div>

      <!-- S5 — the address (16.86 -> 20.50) -->
      <div class="clip" id="s5" data-start="16.86" data-duration="3.64" data-track-index="4">
        <div id="s5-paper"></div>
        <img id="s5-logo" src="assets/img/logo.png" alt="Offscript" />
        <div id="s5-url">offscript.ch</div>
        <div id="s5-rule"></div>
        <div id="s5-tag">CONTENT, DER HÄNGEN BLEIBT.</div>
      </div>

      <!-- ================= AUDIO ================= -->
      <audio id="music" src="assets/music/music.mp3" data-start="0" data-duration="20.5" data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[
          {"t":0,"v":0},{"t":1.2,"v":0.30},{"t":3.6,"v":0.30},{"t":4.1,"v":0.40},
          {"t":12.4,"v":0.38},{"t":16.9,"v":0.30},{"t":18.4,"v":0.16},{"t":19.6,"v":0}]}]}'></audio>

      <!-- one weighted impact, landing exactly on the red flood -->
      <audio id="sfx-takeover" src="assets/sfx/takeover.ogg" data-start="3.70" data-volume="0.62"></audio>
      <!-- four small related accents, on the beat grid -->
      <audio id="sfx-svc0" src="assets/sfx/service.ogg" data-start="8.44"  data-volume="0.30"></audio>
      <audio id="sfx-svc1" src="assets/sfx/service.ogg" data-start="9.50"  data-volume="0.26"></audio>
      <audio id="sfx-svc2" src="assets/sfx/service.ogg" data-start="10.54" data-volume="0.29"></audio>
      <audio id="sfx-svc3" src="assets/sfx/service.ogg" data-start="11.60" data-volume="0.25"></audio>
      <!-- the payoff -->
      <audio id="sfx-land" src="assets/sfx/land.ogg" data-start="15.00" data-volume="0.58"></audio>
      <!-- the rule drawing under the address -->
      <audio id="sfx-rule" src="assets/sfx/rule.ogg" data-start="18.90" data-volume="0.22"></audio>
    </div>

    <script>
      const E = { out: "power3.out", inOut: "power2.inOut", strong: "expo.out" };
      const tl = gsap.timeline({ paused: true });

      /* ---------- S1 — the turn ---------- */
      // Line 1 lands as a compliment and is held; nothing else moves.
      tl.fromTo("#s1a", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.58, ease: E.out }, 0.15);
      tl.fromTo("#s1b", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.58, ease: E.out }, 0.34);
      // beat-locked: 1.60s — the payload. The turn has to land ON the beat.
      tl.fromTo("#s1c", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.48, ease: E.out }, 1.6);
      tl.fromTo("#s1d", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.48, ease: E.out }, 1.78);
      // All four hold together to the cut — the joke needs the whole block up.
      tl.to(".s1-line", { opacity: 0, duration: 0.18, ease: E.inOut }, 3.52);

      /* ---------- S2 — the red takeover ---------- */
      // beat-locked: 3.70s. The red does not fade in; it expands out of the
      // line that earned it, from that line's own left edge.
      // The red spreads ALONG the line it came from, then floods vertically.
      // Full-bleed element scaled from the word's own position, so at scale 1
      // it covers the frame exactly — a 1620px box never could.
      tl.fromTo("#s2-field", { scaleX: 0.05, scaleY: 0.12 }, { scaleX: 1, duration: 0.36, ease: E.strong }, 3.70);
      tl.to("#s2-field", { scaleY: 1, duration: 0.44, ease: "power2.in" }, 3.94);
      tl.fromTo("#s2a", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.44, ease: E.out }, 4.34);
      tl.fromTo("#s2b", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.44, ease: E.out }, 4.5);
      tl.to(".s2-line", { opacity: 0, duration: 0.2, ease: E.inOut }, 7.16);
      tl.to("#s2-field", { opacity: 0, duration: 0.22, ease: E.inOut }, 7.16);

      /* ---------- S3 — the service system ---------- */
      tl.fromTo("#s3-label", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 7.52);
      // The rail draws downward — it is the anchor all four are measured against.
      tl.fromTo("#s3-rail", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: E.out }, 7.56);
      // beat-grid: 8.44 / 9.50 / 10.54 / 11.60 — every other beat at 114.84 BPM,
      // ~1.06s apart, clear of the 0.8s floor for short labels.
      [["#svc0", 8.44], ["#svc1", 9.50], ["#svc2", 10.54], ["#svc3", 11.60]].forEach(([sel, t]) => {
        tl.fromTo(sel + " .nm", { opacity: 0, x: 34 }, { opacity: 1, x: 0, duration: 0.42, ease: E.out }, t);
        tl.fromTo(sel + " .idx", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t + 0.06);
      });
      // All four hold together so the set reads as a system, not a list.
      tl.to(["#s3-label", "#s3-rail", ".svc"], { opacity: 0, duration: 0.2, ease: E.inOut }, 12.46);

      /* ---------- S4 — process to proof ---------- */
      // beat-locked: 12.65s — navy rises and the chain reads across it.
      tl.fromTo("#s4-field", { scaleY: 0 }, { scaleY: 1, duration: 0.42, ease: E.out }, 12.65);
      tl.fromTo("#s4-line", { scaleX: 0 }, { scaleX: 1, duration: 1.15, ease: E.inOut }, 12.95);
      ["#st0", "#st1", "#st2", "#st3", "#st4"].forEach((sel, i) => {
        tl.fromTo(sel, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: E.out }, 13.05 + i * 0.22);
      });
      // The number is the thing to remember, so it arrives alone and holds.
      tl.fromTo("#s4-grow", { opacity: 0 }, { opacity: 1, duration: 0.26 }, 14.86);
      tl.fromTo("#s4-num", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.46, ease: E.strong }, 15.0);
      tl.to(["#s4-line", ".stage", "#s4-grow", "#s4-num"], { opacity: 0, duration: 0.22, ease: E.inOut }, 16.64);

      /* ---------- S5 — the address ---------- */
      // Paper lifts back over the navy; everything after this is still.
      tl.fromTo("#s5-paper", { opacity: 0 }, { opacity: 1, duration: 0.34, ease: E.inOut }, 16.86);
      // beat-locked: 17.91s — the logo settles.
      tl.fromTo("#s5-logo", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.55, ease: E.out }, 17.91);
      tl.fromTo("#s5-url", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: E.out }, 18.44);
      // The rule draws once, left to right. Last motion in the video.
      tl.fromTo("#s5-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.46, ease: E.out }, 18.9);
      tl.fromTo("#s5-tag", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 19.3);
      // From ~19.75s nothing moves: the address is read in stillness.

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
